name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build and test (unit + integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Unit tests, H2 integration tests and PostgreSQL integration tests (Testcontainers uses the runner's Docker).
      - run: ./mvnw -B verify
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-reports
          path: '**/target/surefire-reports/'

  smoke:
    name: Smoke test ${{ matrix.version }} in Docker Compose
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: postgres
            compose-file: docker-compose.yml
          - version: embedded
            compose-file: docker-compose.embedded.yml
    steps:
      - uses: actions/checkout@v5
      - run: docker compose -f ${{ matrix.compose-file }} up --build -d --wait
      # Calls the real duck / dog / bear APIs through the running containers.
      - run: scripts/smoke-test.sh http://localhost:8080
      - if: failure()
        run: docker compose -f ${{ matrix.compose-file }} logs
      - if: always()
        run: docker compose -f ${{ matrix.compose-file }} down -v

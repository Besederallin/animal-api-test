spring:
  application:
    name: animal-pictures-embedded
  datasource:
    # File-based H2 database, so pictures survive restarts. Set DATA_DIR to change where it is written.
    url: jdbc:h2:file:${DATA_DIR:./data}/animal-pictures;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # the schema is owned by Flyway (db/migration)

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

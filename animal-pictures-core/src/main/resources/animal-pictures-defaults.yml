# Logging and monitoring settings shared by both versions (imported from each app's application.yml).
# Every value can be overridden with an environment variable, e.g. LOGGING_LEVEL_COM_EXAMPLE_ANIMALPICTURES=DEBUG.

logging:
  pattern:
    # Adds the request ID (see RequestLoggingFilter) to every log line: "INFO [3f2a...] ..."
    level: "%5p [%X{requestId:--}]"
  level:
    com.example.animalpictures: INFO
  # JSON logs for log collectors (ELK, Loki, Datadog...): set LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs (or logstash)

management:
  endpoints:
    web:
      exposure:
        # health = up/down, info = version, metrics + prometheus = numbers, loggers = change log levels at runtime
        include: health,info,metrics,prometheus,loggers
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  info:
    java:
      enabled: true
    os:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Lets Prometheus/Grafana compute latency percentiles (p95, p99) for API requests
      percentiles-histogram:
        http.server.requests: true
